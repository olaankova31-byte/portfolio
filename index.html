.lang button{background:none;border:0;padding:0;font:inherit;cursor:pointer}
.menu{display:none;background:none;border:0;font:inherit;font-size:14px;cursor:pointer;padding:0}
main{min-height:60vh}
.hero-t{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--g);align-items:end;padding:clamp(40px,6vw,96px) var(--m) clamp(28px,4vw,56px)}
.hero h1{grid-column:1/9;font-size:clamp(26px,5.4vw,96px);font-weight:400;white-space:nowrap;margin:0}
.hd{grid-column:9/13}

body>header{border-bottom:1px solid var(--line)}

.ph{background:var(--ph);display:flex;align-items:center;justify-content:center;color:#B5B5B5;font-size:12px;letter-spacing:.02em}

 <button class="menu" id="menu" aria-expanded="false" aria-controls="nav"></button>

 <div class="header-actions"><a class="header-contact" href="contact/" id="header-contact">Контакты ↗</a><div class="lang" role="group" aria-label="Language"><button data-l="ru" aria-pressed="true">RU</button><button data-l="en" aria-pressed="false">EN</button></div></div>
</header>

<script>
/* ---------- STATE ---------- */
let lang='ru';
try{const s=localStorage.getItem('lang');if(s==='en'||s==='ru')lang=s}catch(e){}
const $=s=>document.querySelector(s),app=$('#app');

const lb=e=>e.target.closest('.lang button');
document.addEventListener('click',e=>{const b=lb(e);if(!b)return;if(dlg.open)dlg.close();lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(_){}
 document.querySelectorAll('.lang button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===lang?'true':'false'));route();document.dispatchEvent(new CustomEvent('site:language',{detail:lang}))});
